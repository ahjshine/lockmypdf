<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="robots" content="noindex, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="./lock.svg" type="image/svg+xml" />
    <title>Page not found — lockmypdf</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f4f1ea; color: #0e0e0e; }
      body { box-sizing: border-box; min-width: 320px; min-height: 100vh; margin: 0; display: grid; place-items: center; padding: clamp(20px, 4vw, 56px); }
      main { width: min(100%, 920px); }
      .eyebrow { color: rgba(14, 14, 14, .62); font: 400 0.75rem/1.2 "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.12em; }
      h1 { max-width: 11ch; margin: 18px 0 12px; font-size: clamp(4rem, 14vw, 12rem); font-weight: 700; line-height: .84; letter-spacing: -.08em; }
      p { max-width: 34rem; margin: 0; color: rgba(14, 14, 14, .62); font-size: clamp(1rem, 1.6vw, 1.25rem); line-height: 1.6; }
      a { display: inline-block; margin-top: 28px; padding: 14px 26px; border-radius: 999px; background: #0e0e0e; color: #f4f1ea; font-weight: 500; text-decoration: none; transition: background .25s, color .25s, transform .25s; }
      a:hover, a:focus-visible { background: #d7ff3f; color: #0e0e0e; transform: translateY(-2px); }
      a:focus-visible { outline: 3px solid #0e0e0e; outline-offset: 4px; }
      @font-face { font-family: Inter; src: url("./Inter-Regular.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "JetBrains Mono"; src: url("./JetBrainsMono-Regular.ttf") format("truetype"); font-weight: 400; }
    </style>
  </head>
  <body>
    <main aria-labelledby="page-title">
      <div class="eyebrow">LOCKMYPDF / 404</div>
      <h1 id="page-title">That page is missing.</h1>
      <p>The workspace is still here. Return to lockmypdf to open, edit, organize, sign, or protect a PDF locally in your browser.</p>
      <a href="./">Back to lockmypdf</a>
    </main>
  </body>
</html>
