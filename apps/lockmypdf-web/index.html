<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#010101" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="index, follow" />

    <!-- SEO & Metadata -->
    <title>LockMyPDF — Private, Local-First PDF Editor &amp; Workspace</title>
    <meta name="description" content="Open, edit, organize, sign, and protect PDFs privately in your browser. 100% client-side WebAssembly with zero telemetry, zero uploads, and no account." />
    <meta name="keywords" content="PDF editor, private PDF, local PDF, sign PDF, edit PDF, organize PDF pages, browser PDF, WebAssembly, open source PDF" />
    <link rel="canonical" href="./" />

    <!-- OpenGraph (Facebook / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LockMyPDF" />
    <meta property="og:title" content="LockMyPDF — Private, Local-First PDF Editor" />
    <meta property="og:description" content="Open, edit, organize, sign, and protect PDFs privately in your browser with pure WebAssembly." />
    <meta property="og:image" content="icon-512.png" />
    <meta property="og:url" content="./" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LockMyPDF — Private, Local-First PDF Editor" />
    <meta name="twitter:description" content="Open, edit, organize, sign, and protect PDFs privately in your browser with pure WebAssembly." />
    <meta name="twitter:image" content="icon-512.png" />

    <!-- Apple iOS / PWA / App Store meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LockMyPDF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Structured Data (Schema.org JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "LockMyPDF",
      "url": "./",
      "description": "Private, local-first PDF editor and document toolkit compiled to WebAssembly. Edit text, organize pages, sign forms, and password-protect PDFs locally.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "All",
      "browserRequirements": "Requires WebAssembly, WebGL",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Private in-browser processing",
        "Page organizing and reordering",
        "Text and image editing",
        "Interactive form filling and digital signatures",
        "Password protection and encryption",
        "Zero cloud uploads and zero telemetry"
      ]
    }
    </script>

    <!-- Preload Critical Fonts for Fast Render -->
    <link rel="preload" href="Inter-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="Inter-SemiBold.ttf" as="font" type="font/ttf" crossorigin />

    <!-- Icons & Manifest (Trunk pipeline) -->
    <link data-trunk rel="icon" href="../../assets/icons/lock.svg" type="image/svg+xml" />
    <link data-trunk rel="copy-file" href="../../assets/icons/lock.svg" />
    <link data-trunk rel="copy-file" href="../../assets/app-icon/lockmypdf.svg" />
    <link data-trunk rel="copy-file" href="icon-192.png" />
    <link data-trunk rel="copy-file" href="icon-192-maskable.png" />
    <link data-trunk rel="copy-file" href="icon-512.png" />
    <link data-trunk rel="copy-file" href="icon-512-maskable.png" />
    <link data-trunk rel="copy-file" href="apple-touch-icon.png" />
    <link data-trunk rel="copy-file" href="manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="sw.js" />
    <link data-trunk rel="copy-file" href="robots.txt" />
    <link data-trunk rel="copy-file" href="sitemap.xml" />
    <link data-trunk rel="copy-file" href="../../assets/fonts/Inter-Regular.ttf" />
    <link data-trunk rel="copy-file" href="../../assets/fonts/Inter-Medium.ttf" />
    <link data-trunk rel="copy-file" href="../../assets/fonts/Inter-SemiBold.ttf" />
    <link data-trunk rel="copy-file" href="../../assets/fonts/JetBrainsMono-Regular.ttf" />
    <link data-trunk rel="copy-file" href="404.html" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" href="./lock.svg" type="image/svg+xml" />
    <link data-trunk rel="css" href="landing.css" />
    <link data-trunk rel="rust" data-wasm-opt="0" />
  </head>
  <body>
    <div id="lockmypdf-loading" role="status" aria-live="polite">
      <strong>lockmypdf</strong>
      <span>starting your local workspace</span>
    </div>

    <canvas id="lockmypdf" aria-label="lockmypdf PDF workspace" role="application"></canvas>
    <noscript>
      <main aria-labelledby="noscript-title">
        <h1 id="noscript-title">LockMyPDF — private PDF workspace</h1>
        <p>LockMyPDF opens, organizes, signs and protects PDFs locally in your browser. Enable JavaScript and WebAssembly to start the workspace.</p>
      </main>
    </noscript>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('sw.js').catch(function(err) {
            console.warn('SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
