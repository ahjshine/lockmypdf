[package]
name = "lockmypdf-cli"
description = "lockmypdf command-line tool: inspect, render and robustness-check PDFs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lockmypdf-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
lockmypdf-render = { workspace = true }
serde_json = { workspace = true }
lockmypdf-engine = { workspace = true }
lockmypdf-audit = { workspace = true }
lockmypdf-cos = { workspace = true }
lockmypdf-preflight = { workspace = true }
lockmypdf-automation = { workspace = true }
lockmypdf-platform = { workspace = true }
base64 = "0.23"

[dev-dependencies]
# Decodes `render` output in tests/it/owner_password.rs; already a dependency of the engine.
png = "0.18"

[target.'cfg(unix)'.dependencies]
# `geteuid` for `ui`'s control-file owner check: safe, so no `unsafe` libc call here.
# Already in Cargo.lock through the GUI crates.
rustix = { version = "1", features = ["process"] }

[build-dependencies]
# VERSIONINFO for lockmypdf-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[features]
default = ["mcp"]
# The opt-in MCP server (`lockmypdf-cli mcp`). Build with --no-default-features to leave it out.
mcp = ["lockmypdf-automation/mcp"]
